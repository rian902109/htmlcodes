<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>JavaScript Palindrome checking function</h2>
    <script>
        function Palindrome(mystring){
          var input = mystring.replace(/[^A-Z 0-9]/ig, "").toLowerCase() ;
          var reversedInput =  input.split('').reverse('').join('');

          if(input===reversedInput){
            document.write("<div>" + mystring + "is palindrome </div>" )
          }
          else{
            document.write("<div>" + mystring + "is not palindrome </div>")
          }
        }
        Palindrome("madam")
    </script>
</body>
</html>
