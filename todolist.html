<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Add your To Do List here</h3>
	<form id="myForm">
		<input id="myInput" type="text">
        <button>add</button>
    </form>
    <script>
        var myForm = document.getElementById("myForm");
var myInput = document.getElementById("myInput");
var myItem = document.getElementById("myItem");
myForm.addEventListener("submit", function(event) {event.preventDefault();createItem(myInput.value)})
function createItem(inputitems){var items = `<li>${inputitems} <button onclick="deleteElement(this)">Delete </button></li>`
myItem.insertAdjacentHTML("beforeend", items)

myInput.value = ""
myInput.focus()
}

function deleteElement(ElementToDelete){
    ElementToDelete.parentElement.remove()
}

    </script>    
</body>
</html>
