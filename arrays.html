<!DOCTYPE html>
<html>
    <body>
        
        <h2>JavaScript Arrays</h2>

        <p id="demo"></p>

        <script>
            var cars =[
                "Toyota",
                "B.M.W",
                "Mercedes",
            ];
            var i;
            var text=""
            for(i=0;i<3;i++)
            {
                text += cars[i];
            }        
        
        
            document.getElementById("demo").innerHTML = cars;
        </script>
    </body>
</html>
