<html>
    <head>
        <style>
            body{
               font-family: Arial, Helvetica, sans-serif; 
               background-color: red;
               background:linear-gradient(to bottom, red,orange,gold);
               background-repeat: no-repeat;
               padding: 30px;
               text-align: center;
            }

            h1{color: gold;}

            /*sibling selector- styles the paragraph right after h1 */
            h1 +p{
                background: linear-gradient(to top,white,yellow,gold);
                padding: 10px 20px ;
                border-radius: 8px;
                color: #bf360c;
                display: inline-block;
            }
            ul { padding: 0; margin-top: 20px; }

            /* Child Selector - styles only direct li children of ul */
            ul > li {
              list-style: none;
              font-size: 18px;
              font-weight: bold;
              color: #562213;
              padding: 10px 20px;
              margin: 6px auto;
              width: 260px;
             background:linear-gradient(to left,coral,yellow,white );
             border-radius: 8px;
            }

            /* nth-child - highlights the 3rd item as Chef's Special */
            ul li:nth-child(3) {
             background: #d05e49;
             color: #512406;
            }

            .dis {
             color: #ba644d;
             margin-top: 20px;
             font-size: 15px;
             max-width: 400px;
             margin-left: auto;
             margin-right: auto;
            }

            /* first-letter - makes the first letter big and bold */
            .dis::first-letter {
             font-size: 220%;
             color: #cac3bd;
             font-weight: bold;
            }

            .links { margin-top: 25px; }

            /* Hover Effect - links glow when mouse moves over them */
            a {
             color: #f6f6f6;
             text-decoration: none;
             font-size: 15px;
             margin: 0 12px;
             padding: 8px 18px;
             border: 2px solid #e65c00;
             border-radius: 8px;
            }

            a:hover {
             background: #e65c00;
             color: white;
            }
            </style>
    </head>
    <body>
        <h1>Mc Donald menu</h1>
        <p>im lovin it</p>

        <ul>
            <li>Mc nuggets</li>
            <li>Big mac</li>
            <li>Mc frosty</li>
            <li>happy meal-chefs special</li>
            <li>Mc chips</li>

        </ul>

        <p class="dis"> every dish is hand made, loaded with flavour 
            with a secret ingreadent of love
        </p>

        <div class="links">
            <a href="#">order now</a>
            <a href="#"> see more</a>
        </div>
    </body>
</html>
